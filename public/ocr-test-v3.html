<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCR Browser Spike v3</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;color:#111}body{margin:0;background:#f4f5f7}main{max-width:760px;margin:auto;padding:16px 14px 40px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pick{display:block;border:2px dashed #aaa;border-radius:12px;padding:16px;text-align:center;font-weight:700;margin:9px 0}input{display:block;width:100%;margin-top:10px}button{width:100%;min-height:48px;border:0;border-radius:11px;background:#111;color:#fff;font-size:16px;font-weight:700;margin:5px 0}button.alt{background:#e9e9ed;color:#111}button:disabled{opacity:.45}img{width:100%;max-height:48vh;object-fit:contain;border-radius:10px}.small{font-size:12px;color:#666;word-break:break-word}.status{padding:10px;border-radius:9px;background:#f1f3f5;font-size:13px;white-space:pre-wrap}.fields{display:grid;grid-template-columns:105px 1fr;gap:6px 8px;font-size:13px}.fields span{white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;max-height:42vh;overflow:auto;background:#111;color:#eee;padding:12px;border-radius:10px}.head{display:flex;justify-content:space-between;gap:8px}</style></head><body><main><h1>OCR Browser Spike v3 — iPhone</h1><p class="small">Throwaway feasibility test • Enhanced 2500 px • official ESM + Safari shims • SDK / model / inference timing</p><section class="card"><label class="pick">🖼 เลือกจาก Photos<input id="file" type="file" accept="image/*"></label><label class="pick">📷 ถ่ายรูป Invoice<input id="camera" type="file" accept="image/*" capture="environment"></label><img id="preview" hidden><p id="meta" class="small">ยังไม่ได้เลือกรูป</p><p id="ua" class="small"></p></section><section class="card"><button id="rapid" disabled>1 · RapidOCR / ONNX</button><button id="paddle" disabled>2 · PaddleOCR.js Official</button><button id="tess" disabled>3 · Tesseract.js</button><button id="all" class="alt" disabled>ทดสอบทั้ง 3 ตัวตามลำดับ</button><div id="status" class="status">พร้อม — เลือกรูป Invoice</div></section><div id="results"></div></main><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.min.js"></script><script src="https://docs.opencv.org/4.10.0/opencv.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script><script type="importmap">{"imports":{"onnxruntime-web":"/ocr-ort-shim.js","@techstark/opencv-js":"/ocr-opencv-shim.js","clipper-lib":"https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/+esm","js-yaml":"https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm"}}</script><script type="module" src="/ocr-rapid-loader.js"></script><script>
const $=id=>document.getElementById(id), buttons=['rapid','paddle','tess','all'].map($);let blob=null,dataURL='';$('ua').textContent=navigator.userAgent;const sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=ms=>(ms/1000).toFixed(1)+' s';function setStatus(s){$('status').textContent=s}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toBlob(c){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('สร้าง OCR image ไม่สำเร็จ')),'image/jpeg',.94))}
async function prep(file){const u=URL.createObjectURL(file);try{const im=new Image();im.decoding='async';im.src=u;await new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(Error('Safari decode รูปไม่สำเร็จ'))});const sc=Math.min(1,2500/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));const x=c.getContext('2d',{alpha:false,willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Uint32Array(256);for(let i=0;i<p.length;i+=4)h[Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2])]++;const n=c.width*c.height;let a=0,lo=0,hi=255;for(let i=0;i<256;i++){a+=h[i];if(a>=n*.01){lo=i;break}}a=0;for(let i=0;i<256;i++){a+=h[i];if(a>=n*.99){hi=i;break}}const span=Math.max(1,hi-lo);for(let i=0;i<p.length;i+=4){let y=.299*p[i]+.587*p[i+1]+.114*p[i+2];y=Math.max(0,Math.min(255,(y-lo)*255/span));p[i]=p[i+1]=p[i+2]=y}x.putImageData(d,0,0);return c}finally{URL.revokeObjectURL(u)}}
async function choose(file){if(!file)return;buttons.forEach(b=>b.disabled=true);setStatus('กำลัง resize + Enhanced preprocessing 2500 px…');try{const c=await prep(file);blob=await toBlob(c);dataURL=c.toDataURL('image/jpeg',.94);$('preview').src=dataURL;$('preview').hidden=false;$('meta').textContent=`${file.name||'camera'} • ${(file.size/1048576).toFixed(2)} MB → ${c.width}×${c.height}px • OCR ${(blob.size/1048576).toFixed(2)} MB`;buttons.forEach(b=>b.disabled=false);$('results').innerHTML='';setStatus('ภาพพร้อม — เลือก engine หรือทดสอบทั้ง 3 ตัว')}catch(e){setStatus('เตรียมภาพ ERROR: '+(e.message||e))}}$('file').onchange=e=>choose(e.target.files?.[0]);$('camera').onchange=e=>choose(e.target.files?.[0]);
function fields(text){const l=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),hit=re=>l.filter(x=>re.test(x)).slice(0,10).join('\n')||'—';return{ref:hit(/\b(cat(?:alog)?|ref(?:erence)?|item\s*no|product\s*code)\b/i),lot:hit(/\b(lot|batch)\b/i),exp:hit(/\b(exp|expiry|expiration|use\s*by)\b/i),qty:hit(/\b(qty|quantity|จำนวน)\b/i)}}function add(name,ok,t,stages,text,conf){const f=fields(text),s=document.createElement('section');s.className='card';s.innerHTML=`<div class="head"><strong>${esc(name)} — ${ok?'OK':'ERROR'}</strong><span>${fmt(t)}</span></div><p class="small">${esc(stages.join(' • '))}${conf!=null?' • confidence '+conf.toFixed(1)+'%':''}</p><div class="fields"><b>Catalog/REF</b><span>${esc(f.ref)}</span><b>LOT/Batch</b><span>${esc(f.lot)}</span><b>Expiry</b><span>${esc(f.exp)}</span><b>Qty</b><span>${esc(f.qty)}</span></div><pre>${esc(text||'(ไม่พบข้อความ)')}</pre>`;$('results').prepend(s)}
async function cvReady(timeout=30000){const t=performance.now();while(performance.now()-t<timeout){let cv=window.cv;if(cv){if(typeof cv.then==='function'){try{cv=await Promise.race([Promise.resolve(cv),new Promise((_,rej)=>setTimeout(()=>rej(Error('cv init timeout')),10000))]);window.cv=cv}catch{}}if(cv&&typeof cv.Mat==='function')return cv}await sleep(200)}throw Error('OpenCV.js runtime ยังไม่ ready ภายใน 30 วินาที')}
async function runRapid(){const t=performance.now(),st=[];try{let s=performance.now();setStatus('RapidOCR: รอ OpenCV + EsearchOCR…');const cv=await cvReady();while(!window.EsearchOCR&&performance.now()-s<10000)await sleep(100);if(!window.EsearchOCR)throw Error('EsearchOCR module ไม่พร้อม');st.push('runtime '+fmt(performance.now()-s));s=performance.now();const assets='https://cdn.jsdelivr.net/npm/paddleocr-browser/dist/',dic=await(await fetch(assets+'ppocr_keys_v1.txt')).text();await window.EsearchOCR.init({detPath:assets+'ppocr_det.onnx',recPath:assets+'ppocr_rec.onnx',dic,ort:window.ort,node:false,cv});st.push('models '+fmt(performance.now()-s));s=performance.now();const r=await window.EsearchOCR.ocr(dataURL);st.push('inference '+fmt(performance.now()-s));const rows=Array.isArray(r)?r:(r?.result||r?.data||[]),text=Array.isArray(rows)?rows.map(x=>x?.text??x?.[1]?.[0]??x?.[1]??'').filter(Boolean).join('\n'):JSON.stringify(r,null,2);add('1 · RapidOCR / ONNX',true,performance.now()-t,st,text);return true}catch(e){add('1 · RapidOCR / ONNX',false,performance.now()-t,st,e.stack||String(e));return false}}
async function runPaddle(){const t=performance.now(),st=[];let ocr;try{let s=performance.now();setStatus('PaddleOCR: import official ESM SDK…');const {PaddleOCR}=await import('https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/dist/index.mjs');if(!PaddleOCR?.create)throw Error('PaddleOCR official ESM SDK ไม่พร้อม');st.push('SDK '+fmt(performance.now()-s));s=performance.now();setStatus('PaddleOCR: โหลด PP-OCRv5 models…');ocr=await PaddleOCR.create({lang:'en',ocrVersion:'PP-OCRv5',worker:false,ortOptions:{backend:'wasm',wasmPaths:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/',numThreads:1,simd:true}});st.push('model init '+fmt(performance.now()-s));s=performance.now();const [r]=await ocr.predict(blob,{textDetLimitSideLen:2500,textRecScoreThresh:.2});st.push('inference '+fmt(performance.now()-s));st.push(`boxes ${r?.metrics?.detectedBoxes??r?.items?.length??0} • recognized ${r?.metrics?.recognizedCount??r?.items?.length??0}`);const text=(r?.items||[]).map(x=>x.text).filter(Boolean).join('\n'),scores=(r?.items||[]).map(x=>x.score).filter(Number.isFinite),conf=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length*100:null;add('2 · PaddleOCR.js Official',true,performance.now()-t,st,text,conf);return true}catch(e){add('2 · PaddleOCR.js Official',false,performance.now()-t,st,e.stack||String(e));return false}finally{try{ocr?.dispose?.()}catch{}}}
async function runTess(){const t=performance.now(),st=[];let w;try{let s=performance.now();setStatus('Tesseract: โหลด worker/model…');w=await Tesseract.createWorker('eng',1,{logger:m=>m?.status&&setStatus(`Tesseract: ${m.status} ${m.progress!=null?Math.round(m.progress*100)+'%':''}`)});st.push('worker/model '+fmt(performance.now()-s));s=performance.now();const{data}=await w.recognize(blob);st.push('inference '+fmt(performance.now()-s));add('3 · Tesseract.js',true,performance.now()-t,st,data.text,data.confidence);return true}catch(e){add('3 · Tesseract.js',false,performance.now()-t,st,e.stack||String(e));return false}finally{try{await w?.terminate?.()}catch{}}}
async function one(fn){buttons.forEach(b=>b.disabled=true);try{await fn()}finally{buttons.forEach(b=>b.disabled=!blob)}}$('rapid').onclick=()=>one(runRapid);$('paddle').onclick=()=>one(runPaddle);$('tess').onclick=()=>one(runTess);$('all').onclick=()=>one(async()=>{await runRapid();await runPaddle();await runTess();setStatus('ทดสอบครบทั้ง 3 engine แล้ว')});
</script></body></html>

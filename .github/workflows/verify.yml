name: HPV regression, lint and typecheck
on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -- hpv
      - run: npx eslint lib/hpv/pagination.ts lib/hpv/pagination.test.ts lib/server/hpv.ts components/hpv-view.tsx
      - run: npx tsc --noEmit

name: OCR v3 spike build
on:
  push:
    branches: ["spike/ocr-v3"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm install --no-save vite@8.3.0
      - run: npx vite build --config spikes/ocr-v3/vite.config.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ocr-v3-vendor
          path: public/ocr-v3-vendor/
          if-no-files-found: error
